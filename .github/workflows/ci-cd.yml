name: CI-CD
on:
  push:
    branches: [main]

env:
  IMAGE: hari9787/demo-app

jobs:
  build-push-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Set image tag (short commit SHA)
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest

      - name: Checkout Helm chart repo
        uses: actions/checkout@v4
        with:
          repository: Charli-kubehive/springboot-helm
          token: ${{ secrets.CHART_REPO_TOKEN }}
          path: chart

      - name: Update image tag in Git
        run: |
          cd chart
          sed -i -E "s/^(\s*tag:\s*).*/\1\"${TAG}\"/" values-dev.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add values-dev.yaml
          git commit -m "ci: deploy ${TAG} to dev" || echo "No changes"
          git pull --rebase
          git push
